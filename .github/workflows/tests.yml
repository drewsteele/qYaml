# Optional: not a required check.
name: tests (optional)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pq
        uses: peachq-org/setup-peachq@v1.0.0
        with:
          version: 0.92.20261116
      - name: Run runTests.q
        shell: bash
        run: |
          $QCMD runTests.q -classic <<'EOF' | tee out.txt
          r:runAll[]
          -1 string[sum r`pass]," of ",string[count r]," cases passed";
          show select test, comment from r where not pass
          exit $[all r`pass;0;1]
          EOF
          echo "**peachq ${{ steps.pq.outputs.version }}:** $(grep -E '^[0-9]+ of [0-9]+ cases passed' out.txt | tail -1)" >> "$GITHUB_STEP_SUMMARY"
